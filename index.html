<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c1524">
  <title>Paulo Cesar Modena Ribeiro</title>
  <!--
    Ficha executiva para a web.
    Coluna única, foto só no topo, resultados antes da cronologia.
    Textos em resume_data.js. Sem barras de percentual nem prêmios inventados.
  -->
  <style>
    :root {
      --navy: #10233a;
      --ink: #1c2833;
      --muted: #5c6b78;
      --line: #e2e8ee;
      --cyan: #1aa6a6;
      --paper: #fff;
      --field: #e6edf4;
      --sans: "Segoe UI", Calibri, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--field);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.55;
      font-weight: 400;
    }
    button, a { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .frame {
      max-width: 880px;
      margin: 0 auto;
      padding: 28px 20px 56px;
    }
    .sheet {
      background: var(--paper);
      border: 1px solid rgba(16, 35, 58, 0.08);
      border-radius: 16px;
      padding: 0 0 40px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(16, 35, 58, 0.12);
    }
    .mast {
      background: #0c1e33;
      color: #e7eef5;
      padding: 22px 44px 26px;
    }
    .mast h1 { color: #fff; }
    .mast .headline { color: #d5e1ec; }
    .mast .contact { color: #c5d3df; }
    .mast .contact a { color: #fff; }
    .mast .tools button {
      background: transparent;
      color: #f4f8fb;
      border-color: rgba(255, 255, 255, 0.38);
    }
    .mast .tools button[aria-pressed="true"] {
      background: #fff;
      color: var(--navy);
      border-color: #fff;
    }
    .sheet > section:not(.stats) { padding: 0 44px; }
    .tools {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .tools button, .tools a {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--navy);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .tools button[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 116px;
      gap: 28px;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.85rem, 3.4vw, 2.15rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--navy);
    }
    .rule { width: 48px; height: 3px; background: var(--cyan); margin: 12px 0; border-radius: 3px; }
    .headline {
      margin: 0;
      color: var(--navy);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      line-height: 1.45;
      text-transform: uppercase;
    }
    .contact {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      margin: 14px 0 0;
      padding: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .contact li { display: inline-flex; align-items: center; max-width: 100%; }
    .contact a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--navy);
      text-decoration: none;
      white-space: nowrap;
    }
    .contact a:hover { text-decoration: underline; }
    .ico { width: 15px; height: 15px; flex: 0 0 15px; display: block; }
    .photo {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 18%;
      border: 3px solid #fff;
      box-shadow: 0 0 0 3px #1aa6a6;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 0;
      padding: 20px 44px 18px;
      background: #e7edf2;
      border-bottom: 1px solid #d5dee6;
    }
    .stats strong {
      display: block;
      min-height: 1.15em;
      font-size: 1.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--navy);
      line-height: 1.15;
    }
    .meter { display: block; height: 3px; margin-top: 8px; background: #d3dce4; border-radius: 3px; overflow: hidden; }
    .meter b { display: block; height: 100%; width: 0; background: var(--cyan); border-radius: 3px; }
    .stats span { display: block; margin-top: 6px; color: var(--muted); font-size: 0.8rem; line-height: 1.4; }
    h2 {
      margin: 30px 0 12px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--navy);
    }
    .profile { margin: 0; }
    .results { list-style: none; margin: 0; padding: 0; }
    .results li { display: grid; grid-template-columns: 2rem 1fr; gap: 8px; margin: 0 0 10px; }
    .idx { color: var(--cyan); font-weight: 700; }
    .company { margin: 8px 0 4px; color: var(--navy); font-size: 1.02rem; font-weight: 600; }
    .company span, .where, .meta { color: var(--muted); font-weight: 400; font-size: 0.88rem; }
    .role { margin: 0 0 14px; }
    .jobs .role { margin-bottom: 0; }
    .jobs .role + .role,
    .jobs .sub {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #d5dde6;
    }
    .role-top { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
    .role h3 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--ink); }
    .period { margin: 0; color: var(--muted); font-size: 0.84rem; font-weight: 600; white-space: nowrap; }
    .scope { margin: 4px 0 0; }
    ul { margin: 6px 0 0; padding-left: 1.15rem; }
    li { margin: 0 0 3px; }
    .sub { margin: 18px 0 8px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--navy); }
    @media (max-width: 720px) {
      .frame { padding: 16px 12px 32px; }
      .sheet { padding-bottom: 28px; border-radius: 12px; }
      .mast { padding: 18px 16px 22px; }
      .stats { padding: 16px; grid-template-columns: 1fr 1fr; }
      .sheet > section:not(.stats) { padding: 0 16px; }
      .hero { grid-template-columns: 1fr; }
      .photo { order: -1; }
      .role-top { flex-direction: column; gap: 2px; }
      .period { white-space: normal; }
    }
    @media print {
      body { background: #fff; }
      .frame { margin: 0; padding: 0; max-width: none; }
      .sheet { box-shadow: none; border: 0; border-radius: 0; }
      .mast, .stats { background: #fff; color: var(--ink); }
      .mast h1, .mast .headline, .mast .contact, .mast .contact a { color: var(--navy); }
      .photo { box-shadow: 0 0 0 3px var(--navy); }
      .no-print { display: none !important; }
      .meter b { width: 100%; }
      .role, .results li { break-inside: avoid; }
      * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <article class="sheet" id="sheet"></article>
  </div>
  <noscript><p style="color:#fff">Ative o JavaScript para montar o currículo.</p></noscript>
  <script src="resume_data.js"></script>
  <script>
    (function () {
      var KEY = "pcm-resume-lang";
      var lang = "pt";
      var DATA = null;
      var UI = {
        pt: {
          profile: "Perfil", results: "Resultados", experience: "Experiência",
          additional: "Experiência adicional", education: "Formação",
          courses: "Cursos", papers: "Publicações", languages: "Idiomas",
          print: "Imprimir",
          stats: [
            { prefix: "", value: 22, decimals: 0, suffix: " anos", caption: "em tesouraria, controladoria, FP&A e controles internos" },
            { prefix: "até ", value: 16, decimals: 0, suffix: "", caption: "profissionais na liderança de equipes" },
            { prefix: "R$ ", value: 1.2, decimals: 1, suffix: " bi", caption: "faturamento do grupo industrial em que atuou" },
            { prefix: "R$ ", value: 20.9, decimals: 1, suffix: " mi", caption: "ganhos tributários e previdenciários, com a área Fiscal e escritórios" }
          ]
        },
        en: {
          profile: "Profile", results: "Results", experience: "Experience",
          additional: "Additional experience", education: "Education",
          courses: "Courses", papers: "Publications", languages: "Languages",
          print: "Print",
          stats: [
            { prefix: "", value: 22, decimals: 0, suffix: " yrs", caption: "across treasury, controllership, FP&A and internal controls" },
            { prefix: "up to ", value: 16, decimals: 0, suffix: "", caption: "professionals in teams he led" },
            { prefix: "BRL ", value: 1.2, decimals: 1, suffix: "bn", caption: "revenue of the industrial group where he worked" },
            { prefix: "BRL ", value: 20.9, decimals: 1, suffix: "m", caption: "tax and social-contribution gains, with Tax and external advisors" }
          ]
        }
      };

      function t(value) {
        if (value == null) return "";
        if (typeof value === "string") return value;
        return value[lang] || value.pt || "";
      }
      function esc(value) {
        return String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function tx(v) { return esc(t(v)); }
      function L(key) { return UI[lang][key]; }
      var countGen = 0;
      function decimalMark() { return lang === "en" ? "." : ","; }
      function formatCount(value, decimals) {
        return value.toFixed(decimals).replace(".", decimalMark());
      }
      function statLabel(item, ratio) {
        return item.prefix + formatCount(item.value * ratio, item.decimals) + item.suffix;
      }
      function paintStat(node, ratio) {
        var item = {
          prefix: node.getAttribute("data-prefix") || "",
          value: Number(node.getAttribute("data-value")),
          decimals: Number(node.getAttribute("data-decimals") || 0),
          suffix: node.getAttribute("data-suffix") || ""
        };
        node.querySelector("strong").textContent = statLabel(item, ratio);
        node.querySelector(".meter b").style.width = (ratio * 100) + "%";
      }
      function runCounters() {
        var nodes = Array.prototype.slice.call(document.querySelectorAll(".stat"));
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce) {
          countGen += 1;
          nodes.forEach(function (node) { paintStat(node, 1); });
          return;
        }
        var gen = ++countGen;
        var duration = 1200;
        var start = performance.now();
        function frame(now) {
          if (gen !== countGen) return;
          var done = true;
          nodes.forEach(function (node, index) {
            var progress = (now - start - index * 80) / duration;
            if (progress < 1) done = false;
            var eased = progress <= 0 ? 0 : 1 - Math.pow(1 - Math.min(1, progress), 3);
            paintStat(node, eased);
          });
          if (!done) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      function initLang() {
        var q = new URLSearchParams(location.search).get("lang");
        var stored = null;
        try { stored = localStorage.getItem(KEY); } catch (e) { stored = null; }
        lang = (q || stored) === "en" ? "en" : "pt";
        document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
        try { localStorage.setItem(KEY, lang); } catch (e) { /* ignora */ }
      }
      async function loadData() {
        if (location.protocol !== "file:") {
          try {
            var res = await fetch("resume_data.json", { cache: "no-store" });
            if (res.ok) {
              var parsed = await res.json();
              if (parsed && parsed.person) return parsed;
            }
          } catch (e) { /* espelho */ }
        }
        if (window.RESUME_DATA && window.RESUME_DATA.person) return window.RESUME_DATA;
        throw new Error("missing");
      }
      function icon(name) {
        if (name === "phone") {
          return "<svg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M7.1 3.2c.3-.3.8-.4 1.2-.2l2 .8c.4.2.7.6.7 1.1v2.2c0 .4-.2.8-.6 1l-1.3.7a11.2 11.2 0 0 0 5.1 5.1l.7-1.3c.2-.4.6-.6 1-.6h2.2c.5 0 .9.3 1.1.7l.8 2c.2.4.1.9-.2 1.2l-1.4 1.4c-.4.4-.9.6-1.5.5C10.6 18.2 5.8 13.4 4.2 6.1c-.1-.6.1-1.1.5-1.5L7.1 3.2z\"/></svg>";
        }
        if (name === "whatsapp") {
          return "<svg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"#25D366\" d=\"M12.04 2C6.58 2 2.15 6.4 2.15 11.83c0 1.74.46 3.44 1.34 4.94L2 22l5.39-1.41a10 10 0 0 0 4.65 1.18h.01c5.46 0 9.89-4.4 9.89-9.83C21.94 6.4 17.5 2 12.04 2zm5.76 13.89c-.24.68-1.4 1.25-1.94 1.33-.5.07-1.12.1-1.81-.11-.41-.13-.94-.31-1.62-.6-2.85-1.23-4.7-4.1-4.84-4.29-.14-.19-1.15-1.53-1.15-2.92 0-1.39.73-2.07.99-2.35.26-.28.57-.35.76-.35h.54c.17 0 .41-.06.64.49.24.57.81 1.97.88 2.11.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.17-.29.37-.42.5-.14.14-.28.29-.12.56.16.28.72 1.18 1.54 1.91 1.06.94 1.95 1.23 2.23 1.37.28.14.44.12.6-.07.16-.19.69-.8.87-1.08.19-.28.37-.23.62-.14.26.09 1.63.77 1.91.91.28.14.46.21.53.33.07.12.07.68-.17 1.36z\"/></svg>";
        }
        if (name === "linkedin") {
          return "<svg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"#0A66C2\" d=\"M4.98 3.5C4.98 4.88 3.88 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1 4.98 2.12 4.98 3.5zM.5 8.5h4V24h-4V8.5zM8.5 8.5h3.84v2.12h.05c.53-1.01 1.84-2.12 3.79-2.12 4.06 0 4.81 2.67 4.81 6.15V24h-4v-7.71c0-1.84-.03-4.2-2.56-4.2-2.56 0-2.95 2-2.95 4.06V24h-4V8.5z\"/></svg>";
        }
        return "<svg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M3 5.5A1.5 1.5 0 0 1 4.5 4h15A1.5 1.5 0 0 1 21 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5v-13zm1.8.7 7.2 5.1 7.2-5.1H4.8zm14.2 1.35-6.55 4.64a.8.8 0 0 1-.9 0L4.99 7.55V18h14.02V7.55z\"/></svg>";
      }
      function bullets(items) {
        if (!items || !items.length) return "";
        return "<ul>" + items.map(function (item) { return "<li>" + tx(item) + "</li>"; }).join("") + "</ul>";
      }
      function paint(data) {
        var person = data.person;
        var html = "";
        html += "<div class=\"mast\">";
        html += "<div class=\"tools no-print\">";
        html += "<button type=\"button\" data-lang=\"pt\" aria-pressed=\"" + (lang === "pt") + "\">PT</button>";
        html += "<button type=\"button\" data-lang=\"en\" aria-pressed=\"" + (lang === "en") + "\">EN</button>";
        html += "<button type=\"button\" id=\"print-btn\">" + esc(L("print")) + "</button></div>";

        html += "<header class=\"hero\"><div>";
        html += "<h1>" + esc(person.fullName) + "</h1><div class=\"rule\"></div>";
        html += "<p class=\"headline\">" + tx(data.headline) + "</p>";
        var whatsapp = "https://wa.me/" + String(person.phone).replace(/\D/g, "");
        html += "<ul class=\"contact\"><li>" + tx(person.location) + "</li>";
        html += "<li><a href=\"" + esc(person.phoneHref) + "\">" + icon("phone") + esc(person.phone) + "</a></li>";
        html += "<li><a href=\"" + esc(whatsapp) + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + icon("whatsapp") + "WhatsApp</a></li>";
        html += "<li><a href=\"mailto:" + esc(person.email) + "\">" + icon("mail") + esc(person.email) + "</a></li>";
        html += "<li><a href=\"" + esc(person.linkedin.url) + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + icon("linkedin") + "LinkedIn</a></li>";
        if (person.portfolio && person.portfolio.url) {
          html += "<li><a href=\"" + esc(person.portfolio.url) + "\">" + tx(person.portfolio.label) + "</a></li>";
        }
        html += "</ul></div>";
        html += "<img class=\"photo\" src=\"paulo-modena.jpg\" alt=\"" + esc(person.fullName) + "\"></header></div>";

        html += "<section class=\"stats\">";
        UI[lang].stats.forEach(function (item) {
          html += "<div class=\"stat\" data-value=\"" + item.value + "\" data-decimals=\"" + item.decimals + "\" data-prefix=\"" + esc(item.prefix) + "\" data-suffix=\"" + esc(item.suffix) + "\">";
          html += "<strong aria-label=\"" + esc(statLabel(item, 1)) + "\">" + esc(statLabel(item, 0)) + "</strong>";
          html += "<i class=\"meter\" aria-hidden=\"true\"><b></b></i><span>" + esc(item.caption) + "</span></div>";
        });
        html += "</section>";

        html += "<section><h2>" + esc(L("profile")) + "</h2><p class=\"profile\">" + tx(data.profile) + "</p></section>";

        html += "<section><h2>" + esc(L("results")) + "</h2><ol class=\"results\">";
        data.achievements.forEach(function (item, i) {
          html += "<li><span class=\"idx\">" + String(i + 1).padStart(2, "0") + "</span><p><strong>" + tx(item.label) + ".</strong> " + tx(item.text) + "</p></li>";
        });
        html += "</ol></section>";

        html += "<section class=\"jobs\"><h2>" + esc(L("experience")) + "</h2>";
        data.experience.forEach(function (job) {
          html += "<h3 class=\"company\">" + esc(job.company) + " <span>· " + tx(job.industry) + " · " + tx(job.period) + "</span></h3>";
          job.roles.forEach(function (role) {
            html += "<article class=\"role\"><div class=\"role-top\"><h3>" + tx(role.title) + "</h3><p class=\"period\">" + tx(role.period) + "</p></div>";
            if (t(role.scope)) html += "<p class=\"scope\">" + tx(role.scope) + "</p>";
            html += bullets(role.bullets) + "</article>";
          });
        });
        html += "<p class=\"sub\">" + esc(L("additional")) + "</p>";
        data.additionalExperience.forEach(function (item) {
          html += "<article class=\"role\"><div class=\"role-top\"><h3>" + tx(item.title) + "</h3><p class=\"period\">" + tx(item.period) + "</p></div>";
          html += "<p class=\"where\">" + esc(item.company) + "</p>" + bullets(item.bullets) + "</article>";
        });
        html += "</section>";

        html += "<section><h2>" + esc(L("education")) + "</h2>";
        data.education.forEach(function (item) {
          var status = t(item.status);
          html += "<article class=\"role\"><div class=\"role-top\"><h3>" + tx(item.credential) + "</h3><p class=\"period\">" + tx(item.period) + "</p></div>";
          html += "<p class=\"meta\">" + esc(item.institution) + (status ? " · " + esc(status) : "") + "</p></article>";
        });
        html += "<p class=\"sub\">" + esc(L("courses")) + "</p><ul>";
        data.certifications.forEach(function (item) {
          if (item.includeInPrint === false) return;
          html += "<li>" + tx(item.name) + (item.institution ? " — " + esc(item.institution) : "") + "</li>";
        });
        html += "</ul><p class=\"sub\">" + esc(L("papers")) + "</p>";
        data.academic.forEach(function (item) {
          var tail = [t(item.event), item.year || ""].filter(Boolean).join(" · ");
          html += "<article class=\"role\"><h3>" + tx(item.title) + "</h3><p class=\"meta\">" + tx(item.kind) + (tail ? " · " + esc(tail) : "") + "</p>";
          if (t(item.detail)) html += "<p class=\"scope\">" + tx(item.detail) + "</p>";
          html += "</article>";
        });
        html += "<p class=\"sub\">" + esc(L("languages")) + "</p><ul>";
        data.languages.forEach(function (item) {
          html += "<li>" + tx(item.name) + " — " + tx(item.level) + "</li>";
        });
        html += "</ul></section>";
        document.title = person.fullName;
        document.getElementById("sheet").innerHTML = html;
        runCounters();
      }

      document.body.addEventListener("click", function (event) {
        var button = event.target.closest("[data-lang]");
        if (button && DATA) {
          lang = button.getAttribute("data-lang") === "en" ? "en" : "pt";
          document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
          try { localStorage.setItem(KEY, lang); } catch (e) { /* ignora */ }
          var url = new URL(location.href);
          url.searchParams.set("lang", lang);
          history.replaceState(null, "", url);
          paint(DATA);
        }
        if (event.target.id === "print-btn") window.print();
      });
      window.addEventListener("beforeprint", function () {
        countGen += 1;
        Array.prototype.forEach.call(document.querySelectorAll(".stat"), function (node) { paintStat(node, 1); });
      });

      initLang();
      loadData().then(function (data) { DATA = data; paint(DATA); }).catch(function () {
        document.getElementById("sheet").innerHTML = "<p>Não foi possível carregar os dados. Mantenha resume_data.js na mesma pasta.</p>";
      });
    })();
  </script>
</body>
</html>
