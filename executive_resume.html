<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Paulo Cesar Modena Ribeiro — Currículo executivo</title>
  <!--
    Versão executiva (apresentação).
    Textos em resume_data.json. Este arquivo só desenha.
    Abertura direta (file://) usa resume_data.js. Servidor local lê o JSON.
  -->
  <style>
    :root {
      --navy: #0B1F3A;
      --ink: #1A2330;
      --muted: #5C6773;
      --line: #E2E5EA;
      --red: #8E1D2F;
      --paper: #ffffff;
      --canvas: #E8EAED;
      --sans: "Segoe UI", Calibri, "Helvetica Neue", Arial, sans-serif;
      --serif: "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.45;
    }
    button, a { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

    /* Barra de controle — não entra na impressão */
    .toolbar {
      background: var(--navy);
      color: #fff;
    }
    .toolbar-inner {
      max-width: 820px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
    }
    .langs, .views { display: flex; gap: 6px; align-items: center; }
    .langs button, #print-btn {
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: transparent;
      color: #fff;
      padding: 6px 10px;
      font-size: 12px;
      letter-spacing: 0.06em;
      cursor: pointer;
    }
    .langs button[aria-pressed="true"] {
      background: #fff;
      color: var(--navy);
      border-color: #fff;
    }
    .views a {
      color: rgba(255, 255, 255, 0.78);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.04em;
      padding: 6px 2px;
    }
    .views a[aria-current="page"] {
      color: #fff;
      box-shadow: inset 0 -2px 0 var(--red);
    }
    #print-btn { margin-left: auto; background: var(--red); border-color: var(--red); }
    #print-btn:hover { filter: brightness(1.08); }

    .gaps {
      max-width: 820px;
      margin: 14px auto 0;
      background: #fff;
      border: 1px solid var(--line);
      border-left: 3px solid var(--red);
      padding: 10px 16px 12px;
      color: var(--ink);
      font-size: 13.5px;
    }
    .gaps summary { cursor: pointer; font-weight: 650; color: var(--navy); }
    .gaps .fine { margin: 6px 0 8px; color: var(--muted); }
    .gaps ul { margin: 0; padding-left: 1.15rem; }
    .gaps li { margin: 0 0 4px; }

    .sheet {
      max-width: 820px;
      margin: 16px auto 48px;
      background: var(--paper);
      padding: 32px 48px 40px;
      box-shadow: 0 1px 2px rgba(11, 31, 58, 0.05), 0 16px 40px rgba(11, 31, 58, 0.06);
    }
    .rule {
      height: 3px;
      background: linear-gradient(90deg, var(--red) 52px, var(--navy) 52px);
      margin: 0 0 20px;
    }

    .name {
      margin: 0;
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(1.35rem, 2.5vw, 1.7rem);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--navy);
      line-height: 1.15;
    }
    .headline {
      margin: 8px 0 0;
      color: var(--red);
      font-size: 0.74rem;
      font-weight: 650;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      line-height: 1.45;
    }
    .contact {
      margin: 14px 0 0;
      padding: 0 0 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
    }
    .sep { color: var(--red); }
    .contact a { color: var(--navy); text-decoration: none; }
    .contact a:hover { color: var(--red); text-decoration: underline; }
    .gap { color: var(--red); font-weight: 650; }

    h2 {
      margin: 20px 0 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--navy);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h2::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--red) 0 22px, var(--line) 22px);
    }
    h3, h4 { margin: 0; color: var(--navy); font-weight: 650; }
    h3 { font-size: 1.02rem; }
    h4 { font-size: 0.98rem; }

    .profile {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.5;
    }
    .comp { margin: 0 0 8px; }
    .comp h3 {
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .comp p { margin: 0; color: var(--ink); font-size: 0.94rem; }

    .achievements { list-style: none; margin: 0; padding: 0; }
    .achievements li {
      display: flex;
      gap: 10px;
      margin: 0 0 8px;
    }
    .idx {
      flex: 0 0 1.5rem;
      font-family: var(--serif);
      color: var(--red);
      font-weight: 700;
      line-height: 1.4;
    }
    .achievements p { margin: 0; }
    .achievements strong { color: var(--navy); font-weight: 650; }

    .employer { margin: 0 0 12px; }
    .employer-head { margin-bottom: 8px; }
    .meta, .note, .scope, .fine {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .note { font-style: italic; }
    .scope { color: var(--ink); margin-top: 4px; }
    .role { margin: 0 0 11px; }
    .role-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .period {
      margin: 0;
      color: var(--muted);
      font-size: 0.84rem;
      white-space: nowrap;
    }
    ul.bullets { margin: 4px 0 0; padding-left: 1.1rem; }
    ul.bullets li { margin: 0 0 3px; padding-left: 2px; }
    ul.bullets li::marker { color: var(--red); }

    .edu, .tech { margin: 0 0 9px; }
    .certs, .academic, .lang-list { margin: 4px 0 0; padding-left: 1.1rem; }
    .certs li, .academic li, .lang-list li { margin: 0 0 4px; }
    .certs li::marker, .academic li::marker, .lang-list li::marker { color: var(--red); }
    .level { color: var(--muted); font-weight: 400; }
    .tech h3 { font-size: 0.92rem; margin-bottom: 2px; }
    .fine { font-size: 0.82rem; }

    @media (max-width: 720px) {
      .sheet { margin: 12px; padding: 22px 16px 28px; }
      #print-btn { margin-left: 0; }
      .role-head { flex-direction: column; align-items: flex-start; gap: 1px; }
      .period { white-space: normal; }
      .contact { font-size: 0.86rem; }
    }

    @media print {
      @page {
        size: A4;
        margin: 10mm 12mm 13mm;
      }
      @page {
        @bottom-left {
          content: "Paulo Cesar Modena Ribeiro";
          font-family: "Segoe UI", sans-serif;
          font-size: 8pt;
          color: #5C6773;
        }
        @bottom-right {
          content: counter(page);
          font-family: "Segoe UI", sans-serif;
          font-size: 8pt;
          color: #5C6773;
        }
      }
      html, body { background: #fff; }
      .no-print, .screen-only { display: none !important; }
      .sheet {
        max-width: none;
        margin: 0;
        padding: 0;
        box-shadow: none;
        font-size: 9.6pt;
        line-height: 1.32;
      }
      .name { font-size: 15.5pt; }
      .headline { font-size: 8pt; margin-top: 3pt; }
      .contact { font-size: 8.5pt; margin-top: 6pt; padding-bottom: 6pt; }
      h2 { margin: 8pt 0 3pt; font-size: 8pt; }
      h3 { font-size: 10pt; }
      h4 { font-size: 10pt; }
      .profile { font-size: 9.6pt; line-height: 1.32; }
      .comp p, .scope, .meta, .note, li, p { font-size: 9.6pt; }
      .period { font-size: 8.5pt; }
      .role { margin-bottom: 6pt; break-inside: avoid; page-break-inside: avoid; }
      .edu, .tech, .achievements li { break-inside: avoid; page-break-inside: avoid; }
      h2, h3, h4 { break-after: avoid; page-break-after: avoid; }
      a { color: inherit; text-decoration: none; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body data-view="premium">
  <div class="toolbar no-print">
    <div class="toolbar-inner">
      <div class="langs" role="group" aria-label="Idioma">
        <button type="button" data-lang="pt" aria-pressed="true">PT-BR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN-US</button>
      </div>
      <nav class="views" aria-label="Versão">
        <a id="link-web" href="index.html">Versão web</a>
        <a id="link-premium" href="executive_resume.html">Versão executiva</a>
        <a id="link-ats" href="executive_resume_ats.html">Versão ATS</a>
      </nav>
      <button type="button" id="print-btn">Imprimir</button>
    </div>
  </div>

  <details id="gaps" class="gaps no-print" open></details>

  <main class="sheet">
    <div class="rule" aria-hidden="true"></div>
    <div id="resume"></div>
  </main>

  <noscript>
    <p>Ative o JavaScript para montar o currículo a partir de resume_data.js.</p>
  </noscript>

  <script src="resume_data.js"></script>
  <script>
    (function () {
      var KEY = "pcm-resume-lang";
      var lang = "pt";
      var DATA = null;

      function t(value) {
        if (value == null) return "";
        if (typeof value === "string") return value;
        return value[lang] || value.pt || "";
      }

      function esc(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function tx(value) {
        return esc(t(value));
      }

      function initLang() {
        var query = new URLSearchParams(location.search).get("lang");
        var stored = null;
        try { stored = localStorage.getItem(KEY); } catch (err) { stored = null; }
        lang = (query || stored) === "en" ? "en" : "pt";
        document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
        try { localStorage.setItem(KEY, lang); } catch (err) { /* armazenamento pode estar bloqueado */ }
      }

      async function loadData() {
        if (location.protocol !== "file:") {
          try {
            var response = await fetch("resume_data.json", { cache: "no-store" });
            if (response.ok) {
              var parsed = await response.json();
              if (parsed && parsed.person) return parsed;
            }
          } catch (err) { /* segue para o espelho local */ }
        }
        if (window.RESUME_DATA && window.RESUME_DATA.person) return window.RESUME_DATA;
        throw new Error("missing-data");
      }

      function bullets(items) {
        if (!items || !items.length) return "";
        return "<ul class=\"bullets\">" + items.map(function (item) {
          return "<li>" + tx(item) + "</li>";
        }).join("") + "</ul>";
      }

      function renderContact(person, actions) {
        var parts = [];
        parts.push("<span>" + tx(person.location) + "</span>");
        parts.push("<a href=\"" + esc(person.phoneHref) + "\">" + esc(person.phone) + "</a>");
        parts.push("<a href=\"mailto:" + esc(person.email) + "\">" + esc(person.email) + "</a>");
        parts.push("<a href=\"" + esc(person.linkedin.url) + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + esc(person.linkedin.label) + "</a>");
        var html = "<p class=\"contact\">" + parts.join("&nbsp;<span class=\"sep\">·</span> ");
        if (person.portfolio && person.portfolio.url) {
          html += "&nbsp;<span class=\"sep\">·</span> <a href=\"" + esc(person.portfolio.url) + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + tx(person.portfolio.label) + "</a>";
        } else {
          html += "<span class=\"screen-only\">&nbsp;<span class=\"sep\">·</span> <span class=\"gap\">" + tx(actions.portfolioMissing) + "</span></span>";
        }
        html += "</p>";
        return html;
      }

      function renderExperience(jobs) {
        return jobs.map(function (job) {
          var roles = job.roles.map(function (role) {
            return "<div class=\"role\">" +
              "<div class=\"role-head\"><h4>" + tx(role.title) + "</h4><p class=\"period\">" + tx(role.period) + "</p></div>" +
              (t(role.scope) ? "<p class=\"scope\">" + tx(role.scope) + "</p>" : "") +
              bullets(role.bullets) +
              "</div>";
          }).join("");
          return "<article class=\"employer\">" +
            "<header class=\"employer-head\">" +
              "<h3>" + esc(job.company) + "</h3>" +
              "<p class=\"meta\">" + tx(job.industry) + " · " + tx(job.period) + "</p>" +
              (t(job.note) ? "<p class=\"note\">" + tx(job.note) + "</p>" : "") +
            "</header>" + roles +
            "</article>";
        }).join("");
      }

      function renderAdditional(items) {
        return items.map(function (item) {
          return "<div class=\"role\">" +
            "<div class=\"role-head\"><h3>" + tx(item.title) + " — " + esc(item.company) + "</h3><p class=\"period\">" + tx(item.period) + "</p></div>" +
            bullets(item.bullets) +
            "</div>";
        }).join("");
      }

      function render(data) {
        var ui = data.ui.premium;
        var actions = data.ui.actions;
        var person = data.person;

        document.title = person.fullName + (lang === "en" ? " — Executive Resume" : " — Currículo executivo");
        document.getElementById("print-btn").textContent = t(actions.print);
        document.getElementById("print-btn").title = t(actions.printHint);
        document.getElementById("link-premium").textContent = t(actions.premium);
        document.getElementById("link-ats").textContent = t(actions.ats);
        document.getElementById("link-premium").href = "executive_resume.html?lang=" + lang;
        document.getElementById("link-ats").href = "executive_resume_ats.html?lang=" + lang;
        document.getElementById("link-web").textContent = lang === "en" ? "Web version" : "Versão web";
        document.getElementById("link-web").href = "index.html?lang=" + lang;
        document.querySelector("[data-lang='pt']").setAttribute("aria-pressed", lang === "pt" ? "true" : "false");
        document.querySelector("[data-lang='en']").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
        document.getElementById("link-premium").setAttribute("aria-current", "page");
        document.getElementById("link-ats").removeAttribute("aria-current");

        var html = "";
        html += "<header><h1 class=\"name\">" + esc(person.fullName) + "</h1>";
        html += "<p class=\"headline\">" + tx(data.headline) + "</p>";
        html += renderContact(person, actions);
        html += "</header>";

        html += "<section><h2>" + tx(ui.profile) + "</h2><p class=\"profile\">" + tx(data.profile) + "</p></section>";

        html += "<section><h2>" + tx(ui.competencies) + "</h2>";
        html += data.competencyGroups.map(function (group) {
          var items = group.items.map(function (item) { return tx(item); }).join(" · ");
          return "<div class=\"comp\"><h3>" + tx(group.title) + "</h3><p>" + items + "</p></div>";
        }).join("");
        html += "</section>";

        html += "<section><h2>" + tx(ui.achievements) + "</h2><ol class=\"achievements\">";
        data.achievements.forEach(function (item, index) {
          var n = String(index + 1).padStart(2, "0");
          html += "<li><span class=\"idx\">" + n + "</span><p><strong>" + tx(item.label) + ".</strong> " + tx(item.text) + "</p></li>";
        });
        html += "</ol></section>";

        html += "<section><h2>" + tx(ui.experience) + "</h2>" + renderExperience(data.experience) + "</section>";
        html += "<section><h2>" + tx(ui.additional) + "</h2>" + renderAdditional(data.additionalExperience) + "</section>";

        html += "<section><h2>" + tx(ui.education) + "</h2>";
        html += data.education.map(function (item) {
          var status = t(item.status);
          return "<article class=\"edu\"><div class=\"role-head\"><h3>" + tx(item.credential) + "</h3><p class=\"period\">" + tx(item.period) + "</p></div>" +
            "<p class=\"meta\">" + esc(item.institution) + (status ? " · " + esc(status) : "") + "</p></article>";
        }).join("");
        html += "</section>";

        html += "<section><h2>" + tx(ui.certifications) + "</h2><ul class=\"certs\">";
        data.certifications.forEach(function (item) {
          var hidden = item.includeInPrint === false ? " class=\"screen-only\"" : "";
          var inst = item.institution ? " — " + esc(item.institution) : "";
          var mark = item.status === "VALIDAR" ? " <span class=\"gap\">" + tx(actions.check) + "</span>" : "";
          var detail = t(item.detail);
          html += "<li" + hidden + "><strong>" + tx(item.name) + "</strong>" + inst + mark +
            (detail ? " <span class=\"fine\">" + esc(detail) + "</span>" : "") + "</li>";
        });
        html += "</ul></section>";

        html += "<section><h2>" + tx(ui.academic) + "</h2><ul class=\"academic\">";
        data.academic.forEach(function (item) {
          var where = t(item.event);
          var year = item.year ? item.year : "";
          var tail = [where, year].filter(Boolean).join(" · ");
          var mark = item.yearStatus === "VALIDAR" ? " <span class=\"gap screen-only\">" + tx(actions.check) + " " + (lang === "en" ? "period" : "período") + "</span>" : "";
          html += "<li><strong>" + tx(item.kind) + " — " + tx(item.title) + "</strong>" +
            (t(item.detail) ? "<br>" + tx(item.detail) : "") +
            (tail ? "<br><span class=\"meta\">" + esc(tail) + "</span>" : "") + mark + "</li>";
        });
        html += "</ul></section>";

        html += "<section><h2>" + tx(ui.technology) + "</h2>";
        html += data.technology.map(function (block) {
          var rows = block.items.map(function (item) {
            var detail = t(item.detail);
            return "<li><strong>" + tx(item.name) + "</strong> <span class=\"level\">(" + tx(item.level) + ")</span>" +
              (detail ? " — " + esc(detail) : "") + "</li>";
          }).join("");
          return "<div class=\"tech\"><h3>" + tx(block.category) + "</h3><ul class=\"certs\">" + rows + "</ul></div>";
        }).join("");
        html += "</section>";

        html += "<section><h2>" + tx(ui.languages) + "</h2><ul class=\"lang-list\">";
        data.languages.forEach(function (item) {
          html += "<li>" + tx(item.name) + " — " + tx(item.level) + "</li>";
        });
        html += "</ul>";
        data.languages.forEach(function (item) {
          if (!item.confirmed && t(item.note)) {
            html += "<p class=\"fine screen-only\">" + tx(item.note) + "</p>";
          }
        });
        html += "</section>";

        document.getElementById("resume").innerHTML = html;

        var gaps = document.getElementById("gaps");
        gaps.innerHTML = "<summary>" + tx(actions.gapsSummary) + " (" + data.gaps.length + ")</summary>" +
          "<p class=\"fine\">" + tx(actions.gapsHint) + "</p><ul>" +
          data.gaps.map(function (item) { return "<li>" + tx(item) + "</li>"; }).join("") +
          "</ul>";
      }

      document.getElementById("print-btn").addEventListener("click", function () {
        window.print();
      });

      document.querySelectorAll("[data-lang]").forEach(function (button) {
        button.addEventListener("click", function () {
          lang = button.getAttribute("data-lang") === "en" ? "en" : "pt";
          document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
          try { localStorage.setItem(KEY, lang); } catch (err) { /* ignora */ }
          var url = new URL(location.href);
          url.searchParams.set("lang", lang);
          history.replaceState(null, "", url);
          if (DATA) render(DATA);
        });
      });

      initLang();
      loadData().then(function (data) {
        DATA = data;
        render(DATA);
      }).catch(function () {
        document.getElementById("resume").innerHTML = "<p>Não foi possível carregar os dados. Mantenha resume_data.js na mesma pasta deste arquivo.</p>";
      });
    })();
  </script>
</body>
</html>
