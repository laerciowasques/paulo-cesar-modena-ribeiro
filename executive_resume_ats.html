<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Paulo Cesar Modena Ribeiro — Currículo ATS</title>
  <!--
    Versão linear para sistemas de recrutamento.
    Sem colunas, tabelas, ícones ou texto em imagem.
    O conteúdo visível está na ordem de leitura. Envie o PDF da impressão, não este HTML.
  -->
  <style>
    :root {
      --navy: #0B1F3A;
      --red: #8E1D2F;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.4;
    }
    button, a { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

    .toolbar { background: var(--navy); color: #fff; }
    .toolbar-inner {
      max-width: 800px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
    }
    .langs, .views { display: flex; gap: 6px; align-items: center; }
    .langs button, #print-btn {
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: transparent;
      color: #fff;
      padding: 6px 10px;
      font-size: 12px;
      letter-spacing: 0.06em;
      cursor: pointer;
    }
    .langs button[aria-pressed="true"] { background: #fff; color: var(--navy); border-color: #fff; }
    .views a { color: rgba(255, 255, 255, 0.78); text-decoration: none; font-size: 12px; padding: 6px 2px; }
    .views a[aria-current="page"] { color: #fff; box-shadow: inset 0 -2px 0 var(--red); }
    #print-btn { margin-left: auto; background: var(--red); border-color: var(--red); }

    .gaps {
      max-width: 800px;
      margin: 14px auto 0;
      border: 1px solid #ccc;
      border-left: 3px solid var(--red);
      padding: 10px 16px 12px;
      font-size: 14px;
    }
    .gaps summary { cursor: pointer; font-weight: 700; }
    .gaps ul { margin: 8px 0 0; padding-left: 1.15rem; }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    h1 { font-size: 22px; line-height: 1.2; margin: 0 0 6px; font-weight: 700; }
    h2 {
      font-size: 15px;
      line-height: 1.3;
      margin: 18px 0 6px;
      padding-bottom: 2px;
      border-bottom: 1px solid #000;
      font-weight: 700;
    }
    h3 { font-size: 15px; line-height: 1.3; margin: 12px 0 2px; font-weight: 700; }
    p { margin: 0 0 6px; }
    ul, ol { margin: 0 0 8px; padding-left: 1.2rem; }
    li { margin: 0 0 3px; }
    a { color: #000; }
    .headline { font-weight: 700; margin-bottom: 8px; }
    .gap { font-weight: 700; }

    @media (max-width: 720px) {
      #print-btn { margin-left: 0; }
    }

    @media print {
      @page { size: A4; margin: 12mm 14mm; }
      .no-print, .screen-only { display: none !important; }
      body { font-size: 11pt; }
      main { max-width: none; padding: 0; }
      h1 { font-size: 16pt; }
      h2 { font-size: 12pt; margin-top: 11pt; }
      h3 { font-size: 11pt; }
      a { color: #000; text-decoration: none; }
      .role { break-inside: avoid; page-break-inside: avoid; }
      h2, h3 { break-after: avoid; page-break-after: avoid; }
    }
  </style>
</head>
<body data-view="ats">
  <div class="toolbar no-print">
    <div class="toolbar-inner">
      <div class="langs" role="group" aria-label="Idioma">
        <button type="button" data-lang="pt" aria-pressed="true">PT-BR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN-US</button>
      </div>
      <nav class="views" aria-label="Versão">
        <a id="link-web" href="index.html">Versão web</a>
        <a id="link-premium" href="executive_resume.html">Versão executiva</a>
        <a id="link-ats" href="executive_resume_ats.html">Versão ATS</a>
      </nav>
      <button type="button" id="print-btn">Imprimir</button>
    </div>
  </div>

  <details id="gaps" class="gaps no-print" open></details>

  <main id="resume"></main>

  <noscript>
    <p>Ative o JavaScript para montar o currículo a partir de resume_data.js.</p>
  </noscript>

  <script src="resume_data.js"></script>
  <script>
    (function () {
      var KEY = "pcm-resume-lang";
      var lang = "pt";
      var DATA = null;

      function t(value) {
        if (value == null) return "";
        if (typeof value === "string") return value;
        return value[lang] || value.pt || "";
      }

      function esc(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function tx(value) {
        return esc(t(value));
      }

      function initLang() {
        var query = new URLSearchParams(location.search).get("lang");
        var stored = null;
        try { stored = localStorage.getItem(KEY); } catch (err) { stored = null; }
        lang = (query || stored) === "en" ? "en" : "pt";
        document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
        try { localStorage.setItem(KEY, lang); } catch (err) { /* armazenamento pode estar bloqueado */ }
      }

      async function loadData() {
        if (location.protocol !== "file:") {
          try {
            var response = await fetch("resume_data.json", { cache: "no-store" });
            if (response.ok) {
              var parsed = await response.json();
              if (parsed && parsed.person) return parsed;
            }
          } catch (err) { /* segue para o espelho local */ }
        }
        if (window.RESUME_DATA && window.RESUME_DATA.person) return window.RESUME_DATA;
        throw new Error("missing-data");
      }

      function bulletList(items) {
        if (!items || !items.length) return "";
        return "<ul>" + items.map(function (item) {
          return "<li>" + tx(item) + "</li>";
        }).join("") + "</ul>";
      }

      function render(data) {
        var ui = data.ui.ats;
        var actions = data.ui.actions;
        var person = data.person;

        document.title = person.fullName + (lang === "en" ? " — ATS Resume" : " — Currículo ATS");
        document.getElementById("print-btn").textContent = t(actions.print);
        document.getElementById("print-btn").title = t(actions.printHint);
        document.getElementById("link-premium").textContent = t(actions.premium);
        document.getElementById("link-ats").textContent = t(actions.ats);
        document.getElementById("link-premium").href = "executive_resume.html?lang=" + lang;
        document.getElementById("link-ats").href = "executive_resume_ats.html?lang=" + lang;
        document.getElementById("link-web").textContent = lang === "en" ? "Web version" : "Versão web";
        document.getElementById("link-web").href = "index.html?lang=" + lang;
        document.querySelector("[data-lang='pt']").setAttribute("aria-pressed", lang === "pt" ? "true" : "false");
        document.querySelector("[data-lang='en']").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
        document.getElementById("link-ats").setAttribute("aria-current", "page");
        document.getElementById("link-premium").removeAttribute("aria-current");

        var html = "";
        html += "<header><h1>" + esc(person.fullName) + "</h1>";
        html += "<p class=\"headline\">" + tx(data.headline) + "</p>";
        html += "<p>" + tx(person.location) + "</p>";
        html += "<p><a href=\"" + esc(person.phoneHref) + "\">" + esc(person.phone) + "</a></p>";
        html += "<p><a href=\"mailto:" + esc(person.email) + "\">" + esc(person.email) + "</a></p>";
        html += "<p><a href=\"" + esc(person.linkedin.url) + "\">" + esc(person.linkedin.url) + "</a></p>";
        if (person.portfolio && person.portfolio.url) {
          html += "<p><a href=\"" + esc(person.portfolio.url) + "\">" + esc(person.portfolio.url) + "</a></p>";
        } else {
          html += "<p class=\"gap screen-only\">" + tx(actions.portfolioMissing) + "</p>";
        }
        html += "</header>";

        html += "<section><h2>" + tx(ui.profile) + "</h2><p>" + tx(data.profile) + "</p></section>";

        html += "<section><h2>" + tx(ui.competencies) + "</h2>";
        data.competencyGroups.forEach(function (group) {
          var items = group.items.map(function (item) { return t(item); }).join("; ");
          html += "<h3>" + tx(group.title) + "</h3><p>" + esc(items) + "</p>";
        });
        html += "</section>";

        html += "<section><h2>" + tx(ui.experience) + "</h2>";
        data.experience.forEach(function (job) {
          html += "<p>" + esc(job.company) + " — " + tx(job.industry) + ". " + tx(job.period) + ". " + tx(job.note) + "</p>";
          job.roles.forEach(function (role) {
            html += "<div class=\"role\"><h3>" + tx(role.title) + ", " + esc(job.company) + "</h3>";
            html += "<p>" + tx(role.period) + "</p>";
            if (t(role.scope)) html += "<p>" + tx(role.scope) + "</p>";
            html += bulletList(role.bullets);
            html += "</div>";
          });
        });
        html += "</section>";

        html += "<section><h2>" + tx(ui.additional) + "</h2>";
        data.additionalExperience.forEach(function (item) {
          html += "<div class=\"role\"><h3>" + tx(item.title) + ", " + esc(item.company) + "</h3>";
          html += "<p>" + tx(item.period) + "</p>";
          html += bulletList(item.bullets);
          html += "</div>";
        });
        html += "</section>";

        html += "<section><h2>" + tx(ui.achievements) + "</h2><ol>";
        data.achievements.forEach(function (item) {
          html += "<li><strong>" + tx(item.label) + ".</strong> " + tx(item.text) + "</li>";
        });
        html += "</ol></section>";

        html += "<section><h2>" + tx(ui.education) + "</h2>";
        data.education.forEach(function (item) {
          var status = t(item.status);
          html += "<h3>" + tx(item.credential) + "</h3>";
          html += "<p>" + esc(item.institution) + "</p>";
          html += "<p>" + tx(item.period) + (status ? " — " + esc(status) : "") + "</p>";
        });
        html += "</section>";

        html += "<section><h2>" + tx(ui.certifications) + "</h2><ul>";
        data.certifications.forEach(function (item) {
          var hidden = item.includeInPrint === false ? " class=\"screen-only\"" : "";
          var inst = item.institution ? " — " + esc(item.institution) : "";
          var mark = item.status === "VALIDAR" ? " " + tx(actions.check) : "";
          var detail = t(item.detail);
          html += "<li" + hidden + ">" + tx(item.name) + inst + mark + (detail ? ". " + esc(detail) : "") + "</li>";
        });
        html += "</ul></section>";

        html += "<section><h2>" + tx(ui.academic) + "</h2><ul>";
        data.academic.forEach(function (item) {
          var where = t(item.event);
          var year = item.year || "";
          var tail = [where, year].filter(Boolean).join(", ");
          var mark = item.yearStatus === "VALIDAR" ? " <span class=\"screen-only\">" + tx(actions.check) + "</span>" : "";
          html += "<li>" + tx(item.kind) + " — " + tx(item.title) + ".";
          if (t(item.detail)) html += " " + tx(item.detail);
          if (tail) html += " " + esc(tail) + ".";
          html += mark + "</li>";
        });
        html += "</ul></section>";

        html += "<section><h2>" + tx(ui.technology) + "</h2>";
        data.technology.forEach(function (block) {
          html += "<h3>" + tx(block.category) + "</h3><ul>";
          block.items.forEach(function (item) {
            var detail = t(item.detail);
            html += "<li>" + tx(item.name) + " — " + tx(item.level) + (detail ? ". " + esc(detail) : "") + "</li>";
          });
          html += "</ul>";
        });
        html += "</section>";

        html += "<section><h2>" + tx(ui.languages) + "</h2><ul>";
        data.languages.forEach(function (item) {
          html += "<li>" + tx(item.name) + " — " + tx(item.level) + "</li>";
        });
        html += "</ul>";
        data.languages.forEach(function (item) {
          if (!item.confirmed && t(item.note)) {
            html += "<p class=\"screen-only\">" + tx(item.note) + "</p>";
          }
        });
        html += "</section>";

        document.getElementById("resume").innerHTML = html;

        var gaps = document.getElementById("gaps");
        gaps.innerHTML = "<summary>" + tx(actions.gapsSummary) + " (" + data.gaps.length + ")</summary>" +
          "<p>" + tx(actions.gapsHint) + "</p><ul>" +
          data.gaps.map(function (item) { return "<li>" + tx(item) + "</li>"; }).join("") +
          "</ul>";
      }

      document.getElementById("print-btn").addEventListener("click", function () {
        window.print();
      });

      document.querySelectorAll("[data-lang]").forEach(function (button) {
        button.addEventListener("click", function () {
          lang = button.getAttribute("data-lang") === "en" ? "en" : "pt";
          document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
          try { localStorage.setItem(KEY, lang); } catch (err) { /* ignora */ }
          var url = new URL(location.href);
          url.searchParams.set("lang", lang);
          history.replaceState(null, "", url);
          if (DATA) render(DATA);
        });
      });

      initLang();
      loadData().then(function (data) {
        DATA = data;
        render(DATA);
      }).catch(function () {
        document.getElementById("resume").innerHTML = "<p>Não foi possível carregar os dados. Mantenha resume_data.js na mesma pasta deste arquivo.</p>";
      });
    })();
  </script>
</body>
</html>
